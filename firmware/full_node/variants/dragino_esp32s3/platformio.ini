[dragino_esp32s3]
extends = esp32_base
board = dragino_esp32s3_n16r8
board_build.arduino.memory_type = qio_opi
build_flags =
  ${esp32_base.build_flags}
  -I variants/dragino_esp32s3
  -D P_LORA_DIO_0=4
  -D P_LORA_DIO_1=6
  -D P_LORA_NSS=5
  -D P_LORA_RESET=14
  -D P_LORA_SCLK=12
  -D P_LORA_MISO=13
  -D P_LORA_MOSI=11
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  -D PIN_GPS_RX=17
  -D PIN_GPS_TX=18
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/dragino_esp32s3>
  +<helpers/sensors>

[env:dragino_esp32s3_repeater]
extends = dragino_esp32s3
build_flags =
  ${dragino_esp32s3.build_flags}
  -D LORA_FREQ=915.0
  -D ADVERT_NAME='"Dragino Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D PERSISTANT_GPS=1
build_src_filter = ${dragino_esp32s3.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${esp32_base.lib_deps}
  ${esp32_ota.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

[env:dragino_esp32s3_companion_radio_ble]
extends = dragino_esp32s3
build_flags =
  ${dragino_esp32s3.build_flags}
  -D LORA_FREQ=915.0
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_USER_BTN=3
  -D PIN_BUZZER=16
  -D PIN_OLED_RESET=-1
  -D DISPLAY_ADDRESS=0x3C
  -D DISPLAY_CLASS=SSD1306Display
  -I examples/companion_radio/ui-new
build_src_filter = ${dragino_esp32s3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13
  end2endzone/NonBlockingRTTTL @ ^1.3.0
  stevemarple/MicroNMEA @ ^2.0.6

[env:dragino_esp32s3_companion_radio_usb]
extends = dragino_esp32s3
build_flags =
  ${dragino_esp32s3.build_flags}
  -D LORA_FREQ=915.0
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_USER_BTN=3
  -D PIN_BUZZER=16
  -D PIN_OLED_RESET=-1
  -D DISPLAY_ADDRESS=0x3C
  -D DISPLAY_CLASS=SSD1306Display
  -I examples/companion_radio/ui-new
build_src_filter = ${dragino_esp32s3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13
  end2endzone/NonBlockingRTTTL @ ^1.3.0
  stevemarple/MicroNMEA @ ^2.0.6
